<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="diagram-face-web-blockchain-title diagram-face-web-blockchain-desc"><title id="diagram-face-web-blockchain-title">Face → Web → Blockchain architecture</title><desc id="diagram-face-web-blockchain-desc">Conceptual architecture: Face embedding to Web candidate search to Canonical SHA-256 to Testnet registry. Based on the public project README.</desc><defs><marker id="diagram-face-web-blockchain-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#B7B6AD" stroke-width="1.2"/></marker></defs><rect width="960" height="520" fill="#15101f"/><g font-family="Arial,sans-serif"><text x="64" y="52" font-size="13" fill="#B7B6AD" >04 / FACE → WEB → BLOCKCHAIN</text><text x="64" y="101" font-size="36" fill="#e8dfd2" >From image to verifiable record.</text><path d="M64 126h832M64 454h832" stroke="#514538" stroke-width="1"/><rect x="65" y="176" width="360" height="70" rx="2" fill="#29241e" stroke="#B7B6AD" stroke-width="1.3"/><text x="82" y="209" font-size="20" fill="#e8dfd2" >Embedding → candidate comparison</text><text x="82" y="232" font-size="11" fill="#b3a593" >LOCAL FACE FEATURES / PUBLIC WEB DISCOVERY</text><path d="M425 211h70" fill="none" stroke="#B7B6AD" stroke-width="1.5" marker-end="url(#diagram-face-web-blockchain-arrow)"/><rect x="505" y="176" width="390" height="70" rx="2" fill="#29241e" stroke="#B7B6AD" stroke-width="1.3"/><text x="522" y="209" font-size="20" fill="#e8dfd2" >Canonical payload → SHA-256</text><text x="522" y="232" font-size="11" fill="#b3a593" >A REPRODUCIBLE CONTENT FINGERPRINT</text><path d="M700 246v70" fill="none" stroke="#B7B6AD" stroke-width="1.5" marker-end="url(#diagram-face-web-blockchain-arrow)"/><rect x="505" y="328" width="390" height="70" rx="2" fill="#29241e" stroke="#B7B6AD" stroke-width="1.3"/><text x="522" y="361" font-size="20" fill="#e8dfd2" >Polygon Amoy registry</text><text x="522" y="384" font-size="11" fill="#b3a593" >TESTNET · ONLY THE HASH GOES ON-CHAIN</text><path d="M505 363H245V246" fill="none" stroke="#B7B6AD" stroke-width="1.5" stroke-dasharray="4 5"/><text x="65" y="396" font-size="11" fill="#a99b8a" >RE-VERIFY CONTENT INTEGRITY</text><text x="64" y="486" font-size="10" fill="#ae9f8b" >CONCEPTUAL SYSTEM DIAGRAM</text><text x="896" y="486" font-size="10" fill="#B7B6AD" text-anchor="end">STUDY / 04</text></g></svg>